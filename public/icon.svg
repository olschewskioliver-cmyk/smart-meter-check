<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#1a3a6b"/>
  <!-- Smart meter outline -->
  <rect x="156" y="120" width="200" height="260" rx="12" fill="none" stroke="#ffffff" stroke-width="16"/>
  <!-- Screen area -->
  <rect x="180" y="148" width="152" height="80" rx="6" fill="#3b7dd8" opacity="0.8"/>
  <!-- Display lines -->
  <line x1="196" y1="172" x2="316" y2="172" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <line x1="196" y1="196" x2="280" y2="196" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <!-- Check mark circle -->
  <circle cx="256" cy="305" r="42" fill="none" stroke="#4ade80" stroke-width="14"/>
  <polyline points="234,305 250,322 280,288" fill="none" stroke="#4ade80" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom dots / buttons -->
  <circle cx="210" cy="360" r="10" fill="#ffffff" opacity="0.4"/>
  <circle cx="256" cy="360" r="10" fill="#ffffff" opacity="0.4"/>
  <circle cx="302" cy="360" r="10" fill="#ffffff" opacity="0.4"/>
</svg>
